kind = "web"
previewPath = "/merchant/"
title = "Jatek Merchant"
description = "A merchant workspace for Jatek restaurant owners to manage orders, menu, catalog, and shop operations."
version = "1.0.0"
id = "artifacts/merchant-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/merchant/" ]
localPort = 19445

[services.development]
run = "pnpm --filter @workspace/merchant-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/merchant-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/merchant-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19445"
BASE_PATH = "/merchant/"
